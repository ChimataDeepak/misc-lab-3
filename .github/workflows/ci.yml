name: misc-lab-3
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: pip install -r requirements.txt
      - run: pytest -q tests          # Testcontainers uses the runner's Docker
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m receipts.generate data/receipts.csv && ./airflow/run-airflow-tests.sh
  hadoop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m receipts.generate data/receipts.csv && ./hadoop/run-streaming.sh data/receipts.csv
