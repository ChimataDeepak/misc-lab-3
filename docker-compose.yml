# Local stack: Postgres (ETL target), the fraud scorer, and optional Ollama.
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: receipts, POSTGRES_PASSWORD: receipts, POSTGRES_DB: receipts}
    ports: ["5433:5432"]
  scorer:
    image: python:3.12-slim
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "pip install -q -r requirements.txt && python -m ml.fraud && uvicorn ml.api:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  ollama:           # optional: docker compose --profile llm up -d
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  ollama: {}
